# GitHub Actions workflow file for deploying Terraform configurations
name: payment-processor-terraform-deployment-pipeline

on:
  push:
    branches: [main]
    paths:
      - 'common-infrastructure-setup/**'
  pull_request:
    branches: [main]
    paths:
      - 'common-infrastructure-setup/**'

# Top-level default permissions
permissions:
  contents: read
  id-token: write

jobs:
  secret_detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run Gitleaks for secret detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform_validate:
    name: Terraform Validate
    needs: secret_detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Explicitly set at job level
    defaults:
      run:
        working-directory: ./common-infrastructure-setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Test AWS STS Call Directly
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::811106941006:role/${{ secrets.AWS_ROLE_NAME }}" \
            --role-session-name "DebugSession" \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 900
      - name: Direct AWS CLI OIDC Test
        run: |
          # 1. Obtain raw JWT token from GitHub's OIDC provider
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          # 2. Print decoded OIDC claims (sub, aud, iss) to check exact values
          echo "=== DECODED JWT CLAIMS ==="
          echo "$OIDC_TOKEN" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss}'

          # 3. Directly call AWS STS via CLI to reveal the true underlying error message
          echo "=== DIRECT AWS STS RESPONSES ==="
          aws sts assume-role-with-web-identity \
            --role-arn "arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}" \
            --role-session-name "GitHubActionsDirectTest" \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 900
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

  terraform_plan:
    name: Terraform Plan
    needs: terraform_validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Explicitly set at job level
    defaults:
      run:
        working-directory: ./common-infrastructure-setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-file
          path: common-infrastructure-setup/tfplan

  terraform_apply:
    name: Terraform Apply
    needs: terraform_plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Explicitly set at job level
    defaults:
      run:
        working-directory: ./common-infrastructure-setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tf-plan-file
          path: common-infrastructure-setup/

      - name: Terraform Apply
        run: terraform apply -input=false tfplan